{{ define "main" }}
  <article class="max-w-full">
    <header>
      <h1 class="mt-5 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
        {{ .Title | emojify }}
      </h1>
    </header>

    <section class="mt-10 prose max-w-full dark:prose-invert">
      {{ .Content }}
    </section>
  </article>
{{ end }}
