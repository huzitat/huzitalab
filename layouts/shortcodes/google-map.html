<div class="google-map">

  <iframe
    src="{{ .Get "embed_url" }}"
    title="{{ .Get "title" }}"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen>
  </iframe>

</div>

<div class="google-map-link">

  <a
    href="{{ .Get "map_url" }}"
    target="_blank"
    rel="noopener noreferrer">
    Google Mapsで場所を確認する →
  </a>

</div>
