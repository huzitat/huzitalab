{{ $isJa := eq .Page.Language.Lang "ja" }}

<div class="google-map">

  <iframe
    src="{{ .Get "embed_url" }}"
    title="{{ .Get "title" }}"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen>
  </iframe>

</div>


<div class="google-map-link">

  <a
    href="{{ .Get "map_url" }}"
    target="_blank"
    rel="noopener noreferrer">

    {{ if $isJa }}
      Google Mapsで場所を確認する →
    {{ else }}
      View location on Google Maps →
    {{ end }}

  </a>

</div>
