name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huzitalab
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --baseURL "https://www.huzitat.com/"
      
      - name: Diagnose generated images
        run: |
          echo "===== Generated image files ====="
          find public -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.svg' \) \
            | sort

          echo
          echo "===== Image references in generated HTML/CSS ====="
          grep -RInE \
            'src=|srcset=|background(-image)?:|url\(' \
            public \
            --include='*.html' \
            --include='*.css' \
            | head -n 300 || true
      
      - name: Upload to Lolipop
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: huzitalab/
          state-name: .huzitalab-deploy-state.json
          log-level: verbose