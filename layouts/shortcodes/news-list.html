{{ $news := where site.RegularPages "Section" "news" }}
{{ $news = $news.ByDate.Reverse }}

<div class="news-list">

{{ range first 5 $news }}

<div class="news-item">

<div class="news-date">
{{ .Date.Format "2006.01" }}
</div>

<div class="news-content">

<h3>
<a href="{{ .RelPermalink }}">
{{ .Title }}
</a>
</h3>

<p>
{{ with .Description }}
  {{ . }}
{{ else }}
  {{ .Summary | plainify | truncate 180 }}
{{ end }}
</p>

</div>

</div>

{{ end }}

</div>
