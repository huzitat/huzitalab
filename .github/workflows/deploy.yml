name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huzitalab
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --baseURL "https://www.huzitat.com/"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to Lolipop
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          python <<'PYTHON'
          import ftplib
          import os
          import ssl
          from pathlib import Path

          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          local_root = Path("public")

          if not local_root.is_dir():
              raise SystemExit("public directory does not exist")

          files = sorted(path for path in local_root.rglob("*") if path.is_file())

          def connect():
              context = ssl.create_default_context()

              ftp = ftplib.FTP_TLS(context=context, timeout=60)
              ftp.connect(server, 21)
              ftp.auth()
              ftp.login(username, password)
              ftp.prot_p()
              ftp.set_pasv(True)

              return ftp

          def enter_directory(ftp, directory):
              try:
                  ftp.cwd(directory)
              except ftplib.error_perm as error:
                  if not str(error).startswith("550"):
                      raise

                  print(f"Creating directory: {directory}")
                  ftp.mkd(directory)
                  ftp.cwd(directory)

          for index, local_file in enumerate(files, start=1):
              relative = local_file.relative_to(local_root)
              remote_parts = relative.parts

              print(f"[{index}/{len(files)}] Uploading: {relative.as_posix()}")

              # PWDが禁止されているため、各ファイルごとに接続し直し、
              # FTPログイン直後を基準に相対移動する
              ftp = connect()

              try:
                  for directory in remote_parts[:-1]:
                      enter_directory(ftp, directory)

                  with local_file.open("rb") as source:
                      ftp.storbinary(
                          f"STOR {remote_parts[-1]}",
                          source,
                          blocksize=64 * 1024,
                      )
              finally:
                  try:
                      ftp.quit()
                  except Exception:
                      ftp.close()

          print(f"Uploaded {len(files)} files successfully.")
          PYTHON