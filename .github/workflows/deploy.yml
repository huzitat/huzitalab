name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huzitalab
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --baseURL "https://www.huzitat.com/"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Test upload to Lolipop
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "GitHub Actions FTP test" > ftp-test.txt

          curl \
            --verbose \
            --fail \
            --show-error \
            --ssl-reqd \
            --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file ftp-test.txt \
            "ftp://$FTP_SERVER/web/huzitalab/ftp-test.txt"